<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#f8faf8"/>
      <stop offset="1" stop-color="#eaf3ed"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#153e2c" flood-opacity=".17"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#background)"/>
  <circle cx="1030" cy="382" r="350" fill="#d6eadc"/>
  <circle cx="1202" cy="75" r="145" fill="#c0dfcb" opacity=".55"/>
  <circle cx="5" cy="800" r="190" fill="#dcece2" opacity=".7"/>

  <rect x="82" y="84" width="47" height="47" rx="14" fill="#176b4a"/>
  <text x="105.5" y="115" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" fill="#fff">C</text>
  <text x="145" y="116" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#18251f">ChromePW</text>

  <text x="82" y="274" font-family="DejaVu Sans, sans-serif" font-size="55" font-weight="bold" fill="#173d2b">Your passwords,</text>
  <text x="82" y="345" font-family="DejaVu Sans, sans-serif" font-size="55" font-weight="bold" fill="#173d2b">within reach.</text>

  <text x="84" y="417" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#435c4d">Save and retrieve credentials in an</text>
  <text x="84" y="452" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#435c4d">encrypted vault with Chrome Sync.</text>

  <rect x="82" y="524" width="241" height="54" rx="27" fill="#dceee4"/>
  <circle cx="110" cy="551" r="7" fill="#176b4a"/>
  <text x="129" y="558" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" fill="#176b4a">Master secret</text>
  <rect x="82" y="594" width="270" height="54" rx="27" fill="#dceee4"/>
  <circle cx="110" cy="621" r="7" fill="#176b4a"/>
  <text x="129" y="628" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" fill="#176b4a">Encrypted backups</text>

  <rect x="728" y="97" width="445" height="628" rx="23" fill="#fff" filter="url(#shadow)"/>
